name: WebKit representative workflow
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  AI_PROVIDER: 'none'
  GEMINI_API_KEY: ''
  AI_ACCESS_SECRET: ''
  LIVE_API_AUTHORIZED: ''
concurrency:
  group: webkit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  webkit-representative:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run doctor
      # Install OS libraries only in this disposable CI runner; local setup is unchanged.
      - run: npx playwright install --with-deps webkit
      - name: Own image, native save and reload, actual split PDFs, pinned assembly guide
        run: npx playwright test --config playwright.webkit.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: webkit-representative
          path: artifacts/goal005/webkit/
          retention-days: 7
