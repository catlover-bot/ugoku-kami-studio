<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
<style>text{font-family:'Noto Sans CJK JP','Zen Kaku Gothic New',sans-serif;fill:#233c33} .title{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:18px}.box{fill:#fff;stroke:#9dada4;stroke-width:2}.line{stroke:#506e60;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#506e60"/></marker></defs>
<rect width="1280" height="800" fill="#f7f5ef"/><text class="title" x="60" y="65">うごく紙工房 — 設計データを中心にした構成</text>
<rect class="box" x="60" y="110" width="355" height="150" rx="16"/><text class="label" x="85" y="150">React / Vite</text><text class="body" x="85" y="185">画像・矩形選択・動きの編集</text><text class="body" x="85" y="215">正面 / 裏側プレビュー・承認</text>
<rect class="box" x="490" y="110" width="355" height="150" rx="16"/><text class="label" x="515" y="150">TypeScript core</text><text class="body" x="515" y="185">DesignDocument / hash / revision</text><text class="body" x="515" y="215">mm幾何・制約検査・紙面配置</text>
<rect class="box" x="910" y="110" width="310" height="150" rx="16"/><text class="label" x="935" y="150">export</text><text class="body" x="935" y="185">原寸PDF / SVG</text><text class="body" x="935" y="215">部品・材料・組み立て図</text>
<path class="line" d="M415 180H480"/><path class="line" d="M845 180H900"/>
<rect class="box" x="60" y="355" width="355" height="150" rx="16"/><text class="label" x="85" y="395">ブラウザ保存 / JSON</text><text class="body" x="85" y="430">画像 + 設計 + 実物記録</text><text class="body" x="85" y="460">明示保存・再開・削除</text><path class="line" d="M230 260V345"/>
<rect class="box" x="490" y="355" width="355" height="150" rx="16"/><text class="label" x="515" y="395">Fastify（同一オリジン）</text><text class="body" x="515" y="430">画像デコード検証 / セッション</text><text class="body" x="515" y="460">アクセス制御・回数/時間制限</text><path class="line" d="M400 250L480 365"/>
<rect class="box" x="910" y="355" width="310" height="150" rx="16"/><text class="label" x="935" y="395">Gemini（初期は無効）</text><text class="body" x="935" y="430">公式 Google GenAI SDK</text><text class="body" x="935" y="460">候補 → 検査 → 利用者承認</text><path class="line" d="M845 420H900"/><path class="line" d="M665 355V270"/>
<rect x="60" y="590" width="1160" height="130" rx="16" fill="#e8eee7"/><text class="label" x="85" y="632">Cloud Run向け単一コンテナを準備（未公開）</text><text class="body" x="85" y="670">利用者ファイルのサーバー永続保存なし。AI状態と制限はインスタンス内メモリ。</text><text class="body" x="85" y="699">幾何検査の成功と、実Gemini・実物動作・公開の確認は別々に記録する。</text>
<text class="body" x="60" y="766">実装資料 / 2026-10-03</text></svg>
