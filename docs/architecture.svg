<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
<title id="title">うごく紙工房の構成</title><desc id="description">同じ設計コアからプレビューとPDFを生成する。AIは明示操作で共通のツールと承認経路へ接続する。既定は無効。ローカルOllamaを選択でき、Geminiへの自動切替はない。</desc>
<style>text{font-family:'Noto Sans CJK JP','Zen Kaku Gothic New',sans-serif;fill:#233c33} .title{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:18px}.box{fill:#fff;stroke:#9dada4;stroke-width:2}.line{stroke:#506e60;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#506e60"/></marker></defs>
<rect width="1280" height="800" fill="#f7f5ef"/><text class="title" x="60" y="65">うごく紙工房 — 設計データを中心にした構成</text>
<rect class="box" x="60" y="110" width="355" height="150" rx="16"/><text class="label" x="85" y="150">React / Vite</text><text class="body" x="85" y="185">作品中心の3工程・希望は一か所</text><text class="body" x="85" y="215">同じ領域で候補比較 → 採用</text>
<rect class="box" x="490" y="110" width="355" height="150" rx="16"/><text class="label" x="515" y="150">TypeScript core</text><text class="body" x="515" y="185">DesignDocument / hash / revision</text><text class="body" x="515" y="215">mm幾何・制約検査・紙面配置</text>
<rect class="box" x="910" y="110" width="310" height="150" rx="16"/><text class="label" x="935" y="150">export</text><text class="body" x="935" y="185">原寸PDF / SVG</text><text class="body" x="935" y="215">部品・材料・組み立て図</text>
<path class="line" d="M415 180H480"/><path class="line" d="M845 180H900"/>
<rect class="box" x="60" y="355" width="355" height="150" rx="16"/><text class="label" x="85" y="395">IndexedDB / JSON</text><text class="body" x="85" y="430">画像 + 設計 + 下書き + 実物記録</text><text class="body" x="85" y="460">自動保存・明示保存・作品一覧</text><path class="line" d="M230 260V345"/>
<rect class="box" x="490" y="355" width="355" height="150" rx="16"/><text class="label" x="515" y="395">Fastify（同一オリジン）</text><text class="body" x="515" y="430">画像検証 / セッション / AI実行</text><text class="body" x="515" y="460">共通ツール・上限・版付き承認</text><path class="line" d="M400 250L480 365"/>
<rect class="box" x="910" y="325" width="310" height="215" rx="16"/><text class="label" x="935" y="363">ModelProvider / adapter</text><text class="body" x="935" y="398">Ollama：ローカル接続のみ</text><text class="body" x="935" y="429">Gemini：今回は無効</text><text class="body" x="935" y="460">既定 none・自動切替なし</text><text class="body" x="935" y="491">署名・元応答はadapter内保持</text><text class="body" x="935" y="521">AIは本人の実行操作時だけ</text><path class="line" d="M845 420H900"/><path class="line" d="M665 355V270"/>
<rect x="60" y="590" width="1160" height="140" rx="16" fill="#e8eee7"/><text class="label" x="85" y="628">同じコアで検査 → 比較・採用 → 同じ設計版のPDF / SVG</text><text class="body" x="85" y="660">利用者ファイルのサーバー永続保存なし。AI状態と制限はインスタンス内メモリ。</text><text class="body" x="85" y="690">手動・模擬・実ローカルAI・実Geminiの記録と、実物動作・公開の確認は分ける。</text><text class="body" x="85" y="719">Cloud Run向けコンテナとWSLは別環境。利用者のローカルAIへ自動接続しない。</text>
<text class="body" x="60" y="776">実装資料 / Goal007-R / 2026-10-04</text></svg>
